{% extends 'blog/base.html' %}

{% block content %}
  <h2>{% if object %}Edit Post{% else %}Create New Post{% endif %}</h2>

  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">
      {% if object %}Update Post{% else %}Create Post{% endif %}
    </button>
  </form>

  <br>
  <a href="{% url 'post-list' %}">← Back to Posts</a>
{% endblock %}
